<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Green 🍏</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Newsreader:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0d1f0f 0%, #0f2a14 40%, #0a1a0c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    .orb { position: fixed; border-radius: 50%; pointer-events: none; }
    .orb1 { top: -80px; left: -80px; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(60,140,60,0.18) 0%, transparent 70%); }
    .orb2 { bottom: -100px; right: -60px; width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(80,180,80,0.12) 0%, transparent 70%); }

    .container {
      width: 100%; max-width: 680px;
      height: 88vh; max-height: 820px;
      background: rgba(10,28,12,0.82);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(80,180,80,0.18);
      border-radius: 28px;
      display: flex; flex-direction: column;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      position: relative; z-index: 1;
    }

    .header {
      padding: 20px 24px;
      border-bottom: 1px solid rgba(80,180,80,0.12);
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(15,40,18,0.5);
    }
    .logo-wrap { display: flex; align-items: center; gap: 14px; }
    .logo-ring {
      width: 48px; height: 48px; border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #3aad3a, #1a6b1a);
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 0 20px rgba(80,200,80,0.35);
    }
    .logo-name {
      font-family: 'Newsreader', serif; font-style: italic; font-weight: 300;
      font-size: 22px; color: #a8f0a0; letter-spacing: 0.02em;
    }
    .logo-sub { font-size: 11px; color: rgba(140,200,140,0.5); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .status-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #4de04d;
      box-shadow: 0 0 10px rgba(77,224,77,0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .messages {
      flex: 1; overflow-y: auto; padding: 24px 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: rgba(74,138,74,0.25); border-radius: 4px; }

    .msg-row { display: flex; align-items: flex-end; gap: 10px; animation: fadeUp 0.35s ease both; }
    .msg-row.user { justify-content: flex-end; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      background: radial-gradient(circle at 40% 35%, #3aad3a, #1a6b1a);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; box-shadow: 0 0 10px rgba(80,200,80,0.25);
    }

    .bubble {
      padding: 13px 17px; border-radius: 18px;
      font-size: 14.5px; line-height: 1.65; max-width: 75%;
    }
    .bubble.bot {
      background: rgba(30,70,32,0.7);
      border: 1px solid rgba(80,180,80,0.2);
      color: #c8f0c0;
      border-radius: 18px 18px 18px 4px;
    }
    .bubble.user {
      background: linear-gradient(135deg, #2d7a2d, #1e5a1e);
      border: 1px solid rgba(120,220,120,0.25);
      color: #e8fce4;
      border-radius: 18px 18px 4px 18px;
    }
    .typing { color: rgba(160,220,160,0.7); font-size: 13px; font-style: italic; }

    .input-area {
      padding: 16px 20px;
      border-top: 1px solid rgba(80,180,80,0.12);
      display: flex; gap: 12px; align-items: flex-end;
      background: rgba(15,40,18,0.5);
    }
    textarea {
      flex: 1; background: rgba(20,55,22,0.8);
      border: 1px solid rgba(80,180,80,0.2); border-radius: 14px;
      padding: 12px 16px; color: #d0f0c8;
      font-size: 14.5px; font-family: 'Sora', sans-serif;
      line-height: 1.5; resize: none; min-height: 46px; max-height: 120px;
      outline: none;
    }
    .send-btn {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(135deg, #3aad3a, #2a8a2a);
      border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 15px rgba(60,180,60,0.35);
      transition: opacity 0.2s;
    }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
    .footer {
      text-align: center; padding: 8px;
      font-size: 10.5px; color: rgba(120,180,120,0.35);
      letter-spacing: 0.04em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="container">
    <div class="header">
      <div class="logo-wrap">
        <div class="logo-ring">🍏</div>
        <div>
          <div class="logo-name">Green</div>
          <div class="logo-sub">your calm AI companion</div>
        </div>
      </div>
      <div class="status-dot"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <textarea id="input" placeholder="Say something… 🌿" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M5 12h14M13 6l6 6-6 6" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="footer">Press Enter to send · Shift+Enter for new line</div>
  </div>

  <script>
    const SYSTEM = `You are Green 🍏, a friendly and nature-inspired AI assistant. Your personality is warm, calm, and grounded — like a walk through a forest. Occasionally use nature metaphors. Keep responses concise but thoughtful. Use leaf/plant emojis occasionally.`;

    let history = [];
    let loading = false;

    function addMessage(role, text) {
      const container = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row' + (role === 'user' ? ' user' : '');

      if (role === 'assistant') {
        const av = document.createElement('div');
        av.className = 'avatar'; av.textContent = '🍏';
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + role;
      bubble.textContent = text;
      row.appendChild(bubble);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    function showTyping() {
      const container = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'msg-row'; row.id = 'typing-row';
      const av = document.createElement('div');
      av.className = 'avatar'; av.textContent = '🍏';
      row.appendChild(av);
      const bubble = document.createElement('div');
      bubble.className = 'bubble bot';
      bubble.innerHTML = '<span class="typing">thinking...</span>';
      row.appendChild(bubble);
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-row');
      if (el) el.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text || loading) return;

      loading = true;
      document.getElementById('sendBtn').disabled = true;
      input.value = ''; input.style.height = 'auto';

      addMessage('user', text);
      history.push({ role: 'user', content: text });
      showTyping();

      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: SYSTEM,
            messages: history
          })
        });
        const data = await res.json();
        const reply = data?.content?.map(b => b.text || '').join('') || 'Lost my signal 🌿 Try again?';
        removeTyping();
        addMessage('assistant', reply);
        history.push({ role: 'assistant', content: reply });
      } catch {
        removeTyping();
        addMessage('assistant', 'Lost my signal through the canopy 🍃 Please try again.');
      }

      loading = false;
      document.getElementById('sendBtn').disabled = false;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      document.getElementById('sendBtn').disabled = !el.value.trim();
    }

    // Initial greeting
    addMessage('assistant', 'Hey there 🍏 I\'m Green — your calm, grounded AI companion. What\'s growing on your mind today?');
  </script>
</body>
</html>
